name: Codacy Analysis

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  codacy-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Normalize SARIF run categories
        if: always()
        run: |
          jq '
            .runs |= to_entries
            | .runs |= map(
                .value.automationDetails.id = ((.value.automationDetails.id // "codacy") + "-" + (.key | tostring))
                | .value
              )
          ' results.sarif > results.normalized.sarif

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.normalized.sarif
