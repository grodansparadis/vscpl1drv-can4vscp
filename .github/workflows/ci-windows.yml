name: Windows CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Create NSIS package
        run: cpack --config build/CPackConfig.cmake -C Release -G NSIS -B "$env:GITHUB_WORKSPACE\\dist"

      - name: Create ZIP package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B "$env:GITHUB_WORKSPACE\\dist"

      - name: Set artifact name
        run: |
          $name = (Select-String -Path build/CPackConfig.cmake -Pattern 'set\(CPACK_PACKAGE_FILE_NAME "(.+)"\)').Matches[0].Groups[1].Value
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*
            !dist/_CPack_Packages
