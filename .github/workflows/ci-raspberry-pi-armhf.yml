name: Raspberry Pi 32-bit (armhf) CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:

      - name: Install git
        run: sudo apt-get update && sudo apt-get install -y git 

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Raspberry Pi armhf packages
        uses: uraimo/run-on-arch-action@9893a0f995e5148dcc313ba661820f3992cffcc1 # v3.3
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          install: |
            apt-get update -q -y
            apt-get install -q -y build-essential cmake ninja-build rpm git
          run: |
            cd /workspace
            git config --global --add safe.directory /workspace
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
            cpack --config build/CPackConfig.cmake -G DEB -B "$PWD/dist"
            cpack --config build/CPackConfig.cmake -G RPM -B "$PWD/dist"
            cpack --config build/CPackConfig.cmake -G TGZ -B "$PWD/dist"

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=$(sed -n 's/^set(CPACK_PACKAGE_FILE_NAME \"\(.*\)\")$/\1/p' build/CPackConfig.cmake)" >> "$GITHUB_ENV"

      - name: Write SHA256SUMS
        id: sha256sums_47
        continue-on-error: true
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-${{ env.ARTIFACT_NAME }}" <<'SHA256SUMS_PATTERNS'
          dist/*
          !dist/_CPack_Packages
          SHA256SUMS_PATTERNS

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*
            !dist/_CPack_Packages
            ${{ steps.sha256sums_47.outputs.file }}
