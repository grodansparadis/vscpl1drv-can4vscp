name: Raspberry Pi 32-bit (armhf) CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Raspberry Pi armhf packages
        uses: uraimo/run-on-arch-action@460cb8e6d9f726a588fc9b5e681c8a6cab09ae41 # v3.2.0
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          install: |
            apt-get update -q -y
            apt-get install -q -y build-essential cmake ninja-build rpm git
          run: |
            cd /workspace
            git config --global --add safe.directory /workspace
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
            cpack --config build/CPackConfig.cmake -G DEB -B "$PWD/dist"
            cpack --config build/CPackConfig.cmake -G RPM -B "$PWD/dist"
            cpack --config build/CPackConfig.cmake -G TGZ -B "$PWD/dist"

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=$(sed -n 's/^set(CPACK_PACKAGE_FILE_NAME \"\(.*\)\")$/\1/p' build/CPackConfig.cmake)" >> "$GITHUB_ENV"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*
            !dist/_CPack_Packages
