name: Raspberry Pi CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-package:
    name: Build ${{ matrix.name }} artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armhf
            arch: armv7
          - name: arm64
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Raspberry Pi packages
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu_latest
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          install: |
            apt-get update -q -y
            apt-get install -q -y cmake ninja-build rpm
          run: |
            cd /workspace
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
            cpack --config build/CPackConfig.cmake -G DEB -B "$PWD/dist"
            cpack --config build/CPackConfig.cmake -G RPM -B "$PWD/dist"
            cpack --config build/CPackConfig.cmake -G TGZ -B "$PWD/dist"

      - name: Upload Raspberry Pi packages
        uses: actions/upload-artifact@v4
        with:
          name: raspberry-pi-${{ matrix.name }}-packages
          path: dist/*